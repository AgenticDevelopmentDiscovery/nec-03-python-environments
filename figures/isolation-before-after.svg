<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Global site-packages versus per-project venv</title>
  <desc id="desc">Before venv, two projects share one global site-packages and cannot install conflicting versions of the same library. After venv, each project gets its own isolated environment, so both versions coexist.</desc>

  <rect width="980" height="300" fill="#ffffff"/>
  <line x1="490" y1="15" x2="490" y2="285" stroke="#d8dee0" stroke-width="2" stroke-dasharray="6,6"/>

  <text x="240" y="32" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#23373b" text-anchor="middle">Before venv</text>
  <text x="740" y="32" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#23373b" text-anchor="middle">After venv</text>

  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23373b"/>
    </marker>
  </defs>

  <!-- LEFT: before -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14">
    <rect x="70" y="60" width="140" height="46" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="140" y="88" text-anchor="middle" fill="#23373b">Project A</text>

    <rect x="250" y="60" width="140" height="46" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="320" y="88" text-anchor="middle" fill="#23373b">Project B</text>

    <line x1="150" y1="106" x2="215" y2="180" stroke="#23373b" stroke-width="2" marker-end="url(#arrowA)"/>
    <line x1="310" y1="106" x2="255" y2="180" stroke="#23373b" stroke-width="2" marker-end="url(#arrowA)"/>

    <rect x="140" y="188" width="220" height="50" rx="6" fill="#23373b"/>
    <text x="250" y="209" text-anchor="middle" fill="#ffffff" font-size="13">site-packages</text>
    <text x="250" y="227" text-anchor="middle" fill="#c7d1d5" font-size="11">(global, shared)</text>

    <text x="250" y="264" text-anchor="middle" fill="#C0392B" font-size="12" font-weight="bold">needs numpy 1.x and 2.x — conflict</text>
  </g>

  <!-- RIGHT: after -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14">
    <rect x="530" y="60" width="140" height="46" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="600" y="88" text-anchor="middle" fill="#23373b">Project A</text>

    <rect x="770" y="60" width="140" height="46" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="840" y="88" text-anchor="middle" fill="#23373b">Project B</text>

    <line x1="600" y1="106" x2="600" y2="182" stroke="#23373b" stroke-width="2" marker-end="url(#arrowA)"/>
    <line x1="840" y1="106" x2="840" y2="182" stroke="#23373b" stroke-width="2" marker-end="url(#arrowA)"/>

    <rect x="525" y="186" width="150" height="52" rx="6" fill="#2E7D32"/>
    <text x="600" y="207" text-anchor="middle" fill="#ffffff" font-size="12">.venv</text>
    <text x="600" y="224" text-anchor="middle" fill="#dff1e1" font-size="11">numpy 1.x</text>

    <rect x="765" y="186" width="150" height="52" rx="6" fill="#2E7D32"/>
    <text x="840" y="207" text-anchor="middle" fill="#ffffff" font-size="12">.venv</text>
    <text x="840" y="224" text-anchor="middle" fill="#dff1e1" font-size="11">numpy 2.x</text>

    <text x="740" y="264" text-anchor="middle" fill="#2E7D32" font-size="12" font-weight="bold">no shared state — no conflict</text>
  </g>
</svg>
