<svg viewBox="0 0 980 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The uv venv-install-lock sequence, annotated</title>
  <desc id="desc">Three terminal commands, each with an arrow to a caption explaining what it does: uv venv creates the sandbox; uv pip install resolves and installs quickly; uv lock writes the full resolved tree to uv.lock.</desc>

  <rect x="0" y="0" width="980" height="290" fill="#ffffff"/>

  <!-- terminal window -->
  <rect x="20" y="14" width="520" height="262" rx="10" fill="#23373b"/>
  <rect x="20" y="14" width="520" height="28" rx="10" fill="#1a2a2e"/>
  <rect x="20" y="30" width="520" height="12" fill="#1a2a2e"/>
  <circle cx="42" cy="28" r="5" fill="#EB811B"/>
  <circle cx="60" cy="28" r="5" fill="#e0c34c"/>
  <circle cx="78" cy="28" r="5" fill="#6bbf6b"/>
  <text x="280" y="32" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9fb0b5" text-anchor="middle">uv</text>

  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16">
    <text x="42" y="95" fill="#f5f5f5"><tspan fill="#EB811B">$ </tspan>uv venv</text>
    <text x="42" y="170" fill="#f5f5f5"><tspan fill="#EB811B">$ </tspan>uv pip install -r requirements.txt</text>
    <text x="42" y="245" fill="#f5f5f5"><tspan fill="#EB811B">$ </tspan>uv lock</text>
  </g>

  <defs>
    <marker id="arrowhead2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23373b"/>
    </marker>
  </defs>

  <line x1="560" y1="88" x2="605" y2="88" stroke="#23373b" stroke-width="2.5" marker-end="url(#arrowhead2)"/>
  <line x1="560" y1="163" x2="605" y2="163" stroke="#23373b" stroke-width="2.5" marker-end="url(#arrowhead2)"/>
  <line x1="560" y1="238" x2="605" y2="238" stroke="#23373b" stroke-width="2.5" marker-end="url(#arrowhead2)"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="615" y="82" font-size="15" font-weight="bold" fill="#23373b">creates the sandbox</text>
    <text x="615" y="101" font-size="12" fill="#4a5a5e">same job as venv, built in Rust for speed</text>

    <text x="615" y="157" font-size="15" font-weight="bold" fill="#23373b">resolves &amp; installs</text>
    <text x="615" y="176" font-size="12" fill="#4a5a5e">a fraction of pip's time, cold cache</text>

    <text x="615" y="232" font-size="15" font-weight="bold" fill="#23373b">writes uv.lock</text>
    <text x="615" y="251" font-size="12" fill="#4a5a5e">full resolved tree; uv sync replays it exactly</text>
  </g>
</svg>
