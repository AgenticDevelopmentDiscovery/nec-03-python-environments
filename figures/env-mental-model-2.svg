<svg viewBox="0 0 980 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A lockfile, handed to the interpreter, installs the exact package set</title>
  <desc id="desc">A lockfile is exact, generated rather than written. Handed to the interpreter, it installs the exact package set with no resolving — the interpreter and that package set together are the environment.</desc>

  <rect width="980" height="200" fill="#ffffff"/>

  <defs>
    <marker id="arrowE2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
  </defs>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- lockfile box -->
    <rect x="30" y="70" width="230" height="66" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="145" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#23373b">lockfile</text>
    <text x="145" y="110" text-anchor="middle" font-size="11" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#4a5a5e">numpy==2.1.3</text>
    <text x="145" y="124" text-anchor="middle" font-size="10" fill="#8a9598">exact — no resolving</text>

    <!-- interpreter box -->
    <rect x="375" y="70" width="230" height="66" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="490" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#23373b">interpreter</text>
    <text x="490" y="110" text-anchor="middle" font-size="11" fill="#4a5a5e">which python</text>
    <text x="490" y="124" text-anchor="middle" font-size="10" fill="#8a9598">installs the lockfile</text>

    <!-- environment box -->
    <rect x="720" y="70" width="230" height="66" rx="6" fill="#23373b"/>
    <text x="835" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">environment</text>
    <text x="835" y="110" text-anchor="middle" font-size="11" fill="#c7d1d5">exact package set</text>
    <text x="835" y="124" text-anchor="middle" font-size="10" fill="#c7d1d5">installed, replayable</text>

    <line x1="264" y1="103" x2="371" y2="103" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arrowE2)"/>
    <text x="317" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">hand to</text>

    <line x1="609" y1="103" x2="716" y2="103" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#arrowE2)"/>
    <text x="662" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">installs, creating</text>
  </g>
</svg>
