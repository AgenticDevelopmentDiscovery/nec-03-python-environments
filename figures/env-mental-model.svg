<svg viewBox="0 0 980 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A spec, handed to the interpreter, resolves into a lockfile</title>
  <desc id="desc">A spec is loose and written by hand. Handed to the interpreter, it resolves into a lockfile: one exact build, generated rather than written.</desc>

  <rect width="980" height="200" fill="#ffffff"/>

  <defs>
    <marker id="arrowE1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EB811B"/>
    </marker>
  </defs>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- spec box -->
    <rect x="30" y="70" width="230" height="66" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="145" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#23373b">spec</text>
    <text x="145" y="110" text-anchor="middle" font-size="11" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#4a5a5e">numpy&gt;=2.0</text>
    <text x="145" y="124" text-anchor="middle" font-size="10" fill="#8a9598">loose — written by hand</text>

    <!-- interpreter box -->
    <rect x="375" y="70" width="230" height="66" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="490" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#23373b">interpreter</text>
    <text x="490" y="110" text-anchor="middle" font-size="11" fill="#4a5a5e">which python</text>
    <text x="490" y="124" text-anchor="middle" font-size="10" fill="#8a9598">resolves the spec</text>

    <!-- lockfile box -->
    <rect x="720" y="70" width="230" height="66" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="835" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#23373b">lockfile</text>
    <text x="835" y="110" text-anchor="middle" font-size="11" font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#4a5a5e">numpy==2.1.3</text>
    <text x="835" y="124" text-anchor="middle" font-size="10" fill="#8a9598">exact — generated</text>

    <line x1="264" y1="103" x2="371" y2="103" stroke="#EB811B" stroke-width="2.5" marker-end="url(#arrowE1)"/>
    <text x="317" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#EB811B">hand to</text>

    <line x1="609" y1="103" x2="716" y2="103" stroke="#EB811B" stroke-width="2.5" marker-end="url(#arrowE1)"/>
    <text x="662" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#EB811B">resolves into</text>
  </g>
</svg>
