<svg viewBox="0 0 980 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How an unpinned dependency is mistaken for a code regression</title>
  <desc id="desc">An unpinned SciPy or NumPy dependency picks up a version bump, which shifts a numerical routine, which changes the fitness score. Without a lockfile this looks like a code regression, when the actual cause is environment drift.</desc>

  <rect width="980" height="190" fill="#ffffff"/>

  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23373b"/>
    </marker>
  </defs>

  <g font-family="Helvetica, Arial, sans-serif" font-size="12">
    <rect x="20" y="15" width="205" height="44" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="122" y="42" text-anchor="middle" fill="#23373b">unpinned SciPy/NumPy</text>

    <rect x="260" y="15" width="205" height="44" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="362" y="42" text-anchor="middle" fill="#23373b">picks up a version bump</text>

    <rect x="500" y="15" width="205" height="44" rx="6" fill="#ffffff" stroke="#23373b" stroke-width="1.5"/>
    <text x="602" y="42" text-anchor="middle" fill="#23373b">numerical output shifts</text>

    <rect x="740" y="15" width="220" height="44" rx="6" fill="#FCE9D6" stroke="#EB811B" stroke-width="1.5"/>
    <text x="850" y="42" text-anchor="middle" fill="#23373b" font-weight="bold">fitness score changes</text>

    <line x1="225" y1="37" x2="257" y2="37" stroke="#23373b" stroke-width="2" marker-end="url(#arrowD)"/>
    <line x1="465" y1="37" x2="497" y2="37" stroke="#23373b" stroke-width="2" marker-end="url(#arrowD)"/>
    <line x1="705" y1="37" x2="737" y2="37" stroke="#23373b" stroke-width="2" marker-end="url(#arrowD)"/>

    <line x1="850" y1="59" x2="850" y2="76" stroke="#8a9598" stroke-width="2"/>
    <line x1="850" y1="76" x2="245" y2="76" stroke="#8a9598" stroke-width="2"/>
    <line x1="245" y1="76" x2="245" y2="98" stroke="#8a9598" stroke-width="2" marker-end="url(#arrowD)"/>
    <line x1="850" y1="76" x2="850" y2="98" stroke="#8a9598" stroke-width="2" marker-end="url(#arrowD)"/>

    <rect x="60" y="100" width="370" height="52" rx="8" fill="#FBEAEA" stroke="#C0392B" stroke-width="1.5"/>
    <text x="245" y="122" text-anchor="middle" fill="#C0392B" font-weight="bold">✗ assumed: "code regressed"</text>
    <text x="245" y="140" text-anchor="middle" fill="#C0392B" font-size="11">nobody touched the code</text>

    <rect x="620" y="100" width="380" height="52" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="810" y="122" text-anchor="middle" fill="#2E7D32" font-weight="bold">✓ actual: environment moved</text>
    <text x="810" y="140" text-anchor="middle" fill="#2E7D32" font-size="11">a lockfile diff would show it</text>
  </g>
</svg>
